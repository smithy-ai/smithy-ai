services:
  orchestrator:
    image: ghcr.io/smithy-ai/orchestrator:${IMAGE_TAG:-dev}
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/orchestrator.yml:/config/orchestrator.yml:ro
      - ./config/workflows:/config/workflows:ro
      - orchestrator-data:/data
    environment:
      - SMITHY_GITLAB_TOKEN=${SMITHY_GITLAB_TOKEN:-}
      - ARCHITECT_GITLAB_TOKEN=${ARCHITECT_GITLAB_TOKEN:-}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
    networks:
      - smithy-net

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - knowledgebase
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - smithy-net
    entrypoint: ["/bin/sh", "-c", "ollama serve & pid=$$!; sleep 5; ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}; ollama pull ${CHAT_MODEL:-llama3.2}; wait $$pid"]

  knowledgebase:
    image: ghcr.io/smithy-ai/knowledgebase:${IMAGE_TAG:-dev}
    restart: unless-stopped
    profiles:
      - knowledgebase
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - CHAT_MODEL=${CHAT_MODEL:-}
      - VCS_URL=${KB_VCS_URL:-}
      - VCS_TOKEN=${KB_VCS_TOKEN:-}
      - WEBHOOK_SECRET=${KB_WEBHOOK_SECRET:-}
    volumes:
      - kb-vectorstore:/app/vectorstore
      - ./config/knowledgebase.yml:/config/knowledgebase.yml:ro
    networks:
      - smithy-net

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    command: caddy reverse-proxy --from ${SMITHY_HOST} --to orchestrator:8080
    networks:
      - smithy-net

volumes:
  orchestrator-data:
  kb-vectorstore:
  ollama-models:
  caddy-data:
  caddy-config:

networks:
  smithy-net:
    name: smithy-net
