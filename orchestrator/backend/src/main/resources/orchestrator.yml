apiVersion: smithy.ai/v1alpha1
kind: OrchestratorConfig

storage:
  database: /config/smithy.db
  metrics: /config/metrics.jsonl

runtime:
  docker:
    command: docker
    network: forgejo-net
    taskImage: claude-task-default:latest
    caches: [pnpm, npm]

agent:
  claude:
    model: claude-opus-5
    oauthToken:
      env: CLAUDE_CODE_OAUTH_TOKEN
    apiKey:
      env: ANTHROPIC_API_KEY
    # Wall-clock budget for a single agent turn (45m, 2h, 900s or PT45M).
    # A turn that overruns is killed inside its container and the step fails.
    turnTimeout: 60m
    # Budget for a turn a human drove from the dashboard, where someone is
    # waiting on the reply in a browser rather than on a build.
    takeoverTimeout: 5m

auth:
  admin:
    passwordHash:
      env: ADMIN_PASSWORD_HASH

connectors:
  forgejo-main:
    provider: forgejo
    url: http://forgejo:3000
    externalUrl: http://localhost:3000
    webhookSecret:
      env: WEBHOOK_SECRET
    actors:
      smithy:
        username: smithy
        token:
          env: SMITHY_FORGEJO_TOKEN
        git:
          name: Smithy
          email: smithy@localhost
defaults:
  vcs: forgejo-main
  issueTracker: event.source
  actor: smithy

workflows:
  definitionsDir: /config/workflows
  repositoryWorkflows: true
  defaults:
    branchPrefix: smithy/
    planApprovedLabel: Plan Approved

ci:
  autofix: false

# Designs a ticket links to, rendered into the agent's container so it can see
# them. Needs a read-only Figma personal access token with the file_content
# scope; off, and nothing is fetched.
figma:
  enabled: false
  token:
    env: FIGMA_TOKEN
  # png, jpg, svg or pdf. Scale 1-4; 2 keeps design text legible.
  format: png
  scale: 2
  # How many frames one ticket may pull in.
  maxDesigns: 10

knowledgebase:
  enabled: false
  url: http://knowledgebase:8000/mcp
  toolName: searchKnowledge
