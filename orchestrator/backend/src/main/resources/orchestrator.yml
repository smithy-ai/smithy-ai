docker:
  command: ${DOCKER_COMMAND:docker}
  network: ${DOCKER_NETWORK:forgejo-net}
  task-image: ${TASK_IMAGE:claude-task-default:latest}
  cache-volumes: ${CACHE_VOLUMES:pnpm,npm}

claude:
  oauth-token: ${CLAUDE_CODE_OAUTH_TOKEN:}
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${CLAUDE_MODEL:claude-opus-5}

vcs:
  provider: ${VCS_PROVIDER:forgejo}
  issue-provider: ${ISSUE_PROVIDER:}

  forgejo:
    url: ${FORGEJO_URL:http://forgejo:3000}
    external-url: ${FORGEJO_EXTERNAL_URL:http://localhost:3000}
    webhook-secret: ${WEBHOOK_SECRET:}
    smithy-token: ${SMITHY_FORGEJO_TOKEN:}
    architect-token: ${ARCHITECT_FORGEJO_TOKEN:}

  gitlab:
    url: ${GITLAB_URL:}
    external-url: ${GITLAB_EXTERNAL_URL:}
    webhook-secret: ${GITLAB_WEBHOOK_SECRET:}
    smithy-token: ${SMITHY_GITLAB_TOKEN:}
    architect-token: ${ARCHITECT_GITLAB_TOKEN:}
    token-type: ${GITLAB_TOKEN_TYPE:}

  github:
    url: ${GITHUB_URL:}
    external-url: ${GITHUB_EXTERNAL_URL:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    smithy-token: ${SMITHY_GITHUB_TOKEN:}
    architect-token: ${ARCHITECT_GITHUB_TOKEN:}

  jira:
    url: ${JIRA_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    bot-account-id: ${JIRA_BOT_ACCOUNT_ID:}
    webhook-secret: ${JIRA_WEBHOOK_SECRET:}
    repo-field: ${JIRA_REPO_FIELD:}
    plan-approved-label: ${JIRA_PLAN_APPROVED_LABEL:plan-approved}
    plan-approved-status: ${JIRA_PLAN_APPROVED_STATUS:}
    # Hand stories with no repository field to the workflows anyway, scoped to
    # their Jira project. A coordinator picks repositories from its catalog, so
    # it does not need the field; a development workflow does.
    stories-without-repo: ${JIRA_STORIES_WITHOUT_REPO:false}

workflow:
  # The label that unlocks implementation, and the prefix of the branches the
  # agent works on. The event adapters read these rather than hardcoding them.
  plan-approved-label: ${PLAN_APPROVED_LABEL:Plan Approved}
  branch-prefix: ${SMITHY_BRANCH_PREFIX:smithy/}

  # Workflow definitions dropped here override the built-in ones by name, and
  # anything new is picked up at startup. This is also where a coordinator's
  # repository catalog goes — see workflows/feature-coordinator.yml.
  definitions-dir: ${WORKFLOW_DIR:/config/workflows}


ci:
  # When false, a failed pipeline pauses the workflow and asks for approval
  # on the MR (reply with a thumbs-up) instead of debugging automatically.
  autofix: ${CI_AUTOFIX:false}

knowledgebase:
  enabled: ${KNOWLEDGEBASE_ENABLED:false}
  url: ${KNOWLEDGEBASE_URL:http://knowledgebase:8000/mcp}
  tool-name: ${KNOWLEDGEBASE_TOOL_NAME:searchKnowledge}

bots:
  smithy:
    user: ${SMITHY_BOT_USER:smithy}
    email: ${SMITHY_BOT_EMAIL:}
  architect:
    user: ${ARCHITECT_BOT_USER:architect}
    email: ${ARCHITECT_BOT_EMAIL:}
