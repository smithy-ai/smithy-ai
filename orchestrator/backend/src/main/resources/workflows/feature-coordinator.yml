# Coordinates one feature across several repositories.
#
# The behaviour reference is the hardcoded "foreman" flow parked at the
# `parked/foreman-reference` tag — 1033 lines of Java that kept its children in
# a JSON file inside its own container and encoded parentage as a "Parent story:"
# marker in each child issue's body. None of that is here: children are ordinary
# issues, and the parent/child graph lives in the run store.
#
# Nothing in this file is provider-specific. A parent story in Jira with children
# as GitLab issues works the same as a story and children in one Forgejo
# instance, because no tracker-native subtask, epic or tasklist is involved.
#
# CONFIGURATION: `catalog` is empty on purpose — the built-in cannot know your
# repositories. Drop a file named feature-coordinator.yml into the workflow
# directory to replace this one, or write your own workflow with
# `metadata.extends: feature-coordinator` and just your catalog under `vars`.

apiVersion: smithy.ai/v1alpha1
kind: Workflow
metadata:
  name: feature-coordinator

vars:
  # Which identity this workflow acts as. A coordinator plans a feature and an
  # agent implements one task of it; a reader of the story should be able to
  # tell which of them wrote something, and a bot should not appear to be
  # answering itself.
  actor: coordinator
  # Where feature stories are raised. An issue assigned anywhere else is
  # ordinary work for the development workflow, not a story to fan out — and
  # that includes the catalog repositories, whose issues this coordinator
  # creates itself.
  #
  # Empty by default, so the built-in claims nothing until it is configured.
  storyRepos: []
  # Repositories this coordinator may fan work out to. The agent plans against
  # this list and nothing else.
  catalog: []
  # The workflow each child issue is worked by.
  childWorkflow: smithy-development
  # Who child issues are assigned to once their dependencies are done.
  botUser: smithy
  # The actor a feature story is handed to. Distinct from botUser: assigning a
  # story to this one is how a person says "plan this across repositories"
  # rather than "do this here".
  coordinatorUser: coordinator
  # Fallback connector for hand-written catalog entries that do not carry their
  # own source. Configured repository catalogs always name a source per entry.
  childConnector: ""
  # A child plan that still misses after this many rounds is escalated to a
  # human rather than argued with indefinitely.
  maxReviewRounds: 3
  # A plan review is several focused passes that must all agree — different
  # lenses catch different failure modes, and one combined pass reliably misses
  # the cross-repository contract mismatches this exists to catch.
  reviewLenses:
    - >-
      contract consistency: endpoint paths, payload shapes, queue and message
      names and config keys must match the feature plan and every sibling plan
    - >-
      scope and acceptance criteria: the plan covers the issue's intent
      completely, and nothing outside it
    - >-
      testing approach: the tests the issue's acceptance criteria demand are
      actually planned

routing:
  # Claims an issue only where stories are raised, and only with somewhere to
  # fan work out to. Without this the built-in claims every issue assigned
  # anywhere — including the child issues it creates itself, which is how a
  # coordinator ends up planning a feature for each task of the feature it just
  # planned.
  - event: issue.assigned
    when: >-
      {{ vars.catalog | length > 0
         and repo.fullName in vars.storyRepos
         and event.assignee == vars.coordinatorUser }}
    action: create
    key: "story:{{ repo.fullName }}#{{ event.issueRef }}"
  - event: [issue.plan_approved, issue.commented]
    when: "{{ vars.catalog | length > 0 and repo.fullName in vars.storyRepos }}"
    action: dispatch
    key: "story:{{ repo.fullName }}#{{ event.issueRef }}"

# Named step lists a transition can reference, so approval by label and approval
# from the dashboard cannot drift apart.
actions:
  fanOut:
    steps:
      - uses: foreach
        id: fanout
        with:
          items: "{{ vars.plan }}"
        steps:
          # An ordinary issue in the target repository. No sub-issue, no
          # epic, no tasklist — not every tracker has them, and the story
          # may not even live in the same system as the work.
          - uses: issue.create
            id: child_issue
            with:
              # In the repository, not in the story tracker: the story may
              # be a Jira ticket and the work is not.
              target: "{{ item.source if item.source else vars.childSource }}"
              owner: "{{ item.owner }}"
              repo: "{{ item.repo }}"
              title: "{{ item.title }}"
              # A reference back to the story, which the tracker turns into a
              # link on both issues. Written here rather than asked of the
              # planning agent, because a backlink that depends on a model
              # remembering a format is a backlink that sometimes is not there.
              #
              # Only where it resolves: a cross-repository reference means
              # nothing if the story lives in another system entirely. And
              # deliberately not the foreman's "Parent story:" marker — that was
              # parsed back out to route events, which is what the run store is
              # for. Nothing reads this.
              body: |-
                {{ item.body }}
                {%- if (item.source if item.source else vars.childSource) == vars.storySource %}

                ---
                Part of {{ vars.storyOwner }}/{{ vars.storyRepo }}#{{ vars.storyRef }}
                {%- endif %}

          - uses: run.spawn
            id: child
            with:
              workflow: "{{ vars.childWorkflow }}"
              state: new
              owner: "{{ item.owner }}"
              repo: "{{ item.repo }}"
              issueRef: "{{ steps.child_issue.issueRef }}"
              index: "{{ index }}"
              dependsOn: "{{ item.dependsOn }}"
              # The child's own connector, so what the engine says about it when
              # it finishes names the system its issue lives in.
              source: "{{ item.source if item.source else vars.childSource }}"

          # This replaces the "Parent story:" marker the foreman appended to
          # each issue body and regex-parsed back out: an event about this
          # issue now finds its run through the store.
          - uses: correlate
            with:
              kind: issue
              ref: "{{ item.owner }}/{{ item.repo }}#{{ steps.child_issue.issueRef }}"
              run: "{{ steps.child.runId }}"

      # Only the children whose dependencies are already satisfied start —
      # the rest wait for the wave they belong to.
      - uses: run.wave
        id: wave

      - uses: foreach
        with:
          items: "{{ steps.wave.released }}"
        steps:
          - uses: issue.assign
            with:
              target: "{{ item.source if item.source else vars.childSource }}"
              owner: "{{ item.owner }}"
              repo: "{{ item.repo }}"
              issue: "{{ item.issueRef }}"
              actors: [smithy]

      - uses: metrics.record
        with:
          name: children_spawned
          children: "{{ steps.fanout.count }}"

state:
  initial: new
  terminal: done

  new:
    on:
      issue.assigned:
        to: awaiting_approval
        steps:
          # One workspace for the whole feature. Only the first catalog
          # repository is cloned: with a large catalog, cloning everything up
          # front costs more than the planning turn itself, and the agent asks
          # for the rest as its plan needs them.
          # From the catalog, not from the story: a story tracked in Jira has no
          # repository behind it, and the event's clone URL is then nothing at all.
          - uses: repo.cloneUrl
            id: workspace_repo
            with:
              target: "{{ vars.catalog[0].source if vars.catalog[0].source else vars.childSource }}"
              owner: "{{ vars.catalog[0].owner }}"
              repo: "{{ vars.catalog[0].repo }}"

          - uses: container.init
            id: workspace
            with:
              name: "coordinator.{{ repo.owner }}.{{ repo.name }}.{{ event.issueRef }}"
              cloneUrl: "{{ steps.workspace_repo.cloneUrl }}"
              branch: ""
              # The story's own repository, because the contract the plan has to
              # honour usually lives beside the story rather than in the code.
              # Skipped when the story came from a tracker with no repository.
              extraRepos:
                - cloneUrl: "{{ repo.cloneUrl }}"
                  path: /story

          - uses: agent.runStructured
            id: plan
            with:
              template: coordinator_plan.md.j2
              tools: [Read, Glob, Grep, Bash]
              vars:
                story_ref: "{{ event.issueRef }}"
                story_title: "{{ event.issueTitle }}"
                story_body: "{{ event.issueBody }}"
                catalog: "{{ vars.catalog }}"
              # owner and repo are separate fields rather than one "owner/repo"
              # string, so no step has to take a substring of anything.
              output:
                summary: string
                issues:
                  - source: string
                    owner: string
                    repo: string
                    title: string
                    body: string
                    dependsOn: [integer]

          - uses: state.var
            with:
              plan: "{{ steps.plan.issues }}"
              storyOwner: "{{ repo.owner }}"
              storyRepo: "{{ repo.name }}"
              storyRef: "{{ event.issueRef }}"
              storySource: "{{ event.source.id }}"
              # Where the children go. The story's own system unless the
              # deployment named another. Resolved once here, because the
              # transitions that create them are triggered by a signal, which
              # carries no story of its own.
              childSource: "{{ vars.childConnector if vars.childConnector else event.source.id }}"

          - uses: issue.comment
            with:
              owner: "{{ repo.owner }}"
              repo: "{{ repo.name }}"
              issue: "{{ event.issueRef }}"
              body: "{{ steps.plan.summary }}"

          - uses: metrics.record
            with:
              name: plan_posted
              issues: "{{ steps.plan.issues }}"

          # Nothing happens until a human approves. The gate holds across
          # restarts because it is a row in the run store, not a parked thread.
          - uses: gate.await
            id: approval
            with:
              key: plan-approval

  awaiting_approval:
    on:
      issue.plan_approved:
        to: executing
        steps:
          - uses: fanOut

      # The same thing, released from the dashboard instead of by a label. Both
      # run the one definition of what approval means.
      "signal:gate-approved":
        to: executing
        steps:
          - uses: fanOut
            if: "{{ event.key == 'plan-approval' }}"

  executing:
    on:
      # A child announcing it finished, straight from its run rather than via a
      # comment on the story that this workflow would have to recognise.
      "signal:child-done":
        steps:
          - uses: run.wave
            id: wave

          - uses: foreach
            with:
              items: "{{ steps.wave.released }}"
            steps:
              - uses: issue.assign
                with:
                  target: "{{ item.source if item.source else vars.childSource }}"
                  owner: "{{ item.owner }}"
                  repo: "{{ item.repo }}"
                  issue: "{{ item.issueRef }}"
                  actors: [smithy]

          - uses: issue.comment
            if: "{{ steps.wave.released | length > 0 }}"
            with:
              target: "{{ vars.storySource }}"
              owner: "{{ vars.storyOwner }}"
              repo: "{{ vars.storyRepo }}"
              issue: "{{ vars.storyRef }}"
              body: "A child finished. Next wave assigned."

          - uses: issue.comment
            if: "{{ steps.wave.complete }}"
            with:
              target: "{{ vars.storySource }}"
              owner: "{{ vars.storyOwner }}"
              repo: "{{ vars.storyRepo }}"
              issue: "{{ vars.storyRef }}"
              body: "Every child issue is done. This feature is complete."

          # Nothing left running, but not everything delivered — someone took the
          # agent off a task, or one of them failed. Saying so beats going quiet.
          - uses: issue.comment
            if: "{{ steps.wave.pending == 0 and steps.wave.abandoned > 0 }}"
            with:
              target: "{{ vars.storySource }}"
              owner: "{{ vars.storyOwner }}"
              repo: "{{ vars.storyRepo }}"
              issue: "{{ vars.storyRef }}"
              body: >-
                {{ steps.wave.abandoned }} of {{ steps.wave.total }} child issues were
                cancelled or failed, so this feature is not complete. Re-assign them to
                pick the work back up.

          - uses: state.set
            if: "{{ steps.wave.complete }}"
            with:
              state: done

          - uses: metrics.record
            if: "{{ steps.wave.complete }}"
            with:
              name: run_completed

  done:
    on: {}
