apiVersion: smithy.ai/v1alpha1
kind: OrchestratorConfig

storage:
  database: build/tmp/smithy-context-test.db
  metrics: build/tmp/smithy-context-metrics.jsonl

runtime:
  docker:
    command: docker
    network: test-net
    taskImage: claude-task:test
    caches: []

agent:
  claude:
    model: claude-opus-5
    oauthToken:
      literal: test-claude-token

auth:
  admin:
    passwordHash:
      literal: ""

connectors:
  forgejo-test:
    provider: forgejo
    url: http://forgejo.invalid:3000
    externalUrl: http://forgejo.invalid:3000
    webhookSecret:
      literal: test-webhook-secret
    actors:
      smithy:
        username: smithy-bot
        token:
          literal: test-smithy-token
        git:
          name: Smithy
          email: smithy@localhost
      architect:
        username: architect-bot
        token:
          literal: test-architect-token
        git:
          name: Architect
          email: architect@localhost
      coordinator:
        username: coordinator-bot
        token:
          literal: test-coordinator-token
        git:
          name: Coordinator
          email: coordinator@localhost

defaults:
  vcs: forgejo-test
  issueTracker: event.source
  actor: smithy

workflows:
  definitionsDir: build/tmp/no-external-workflows
  repositoryWorkflows: true
  defaults:
    branchPrefix: smithy/
    planApprovedLabel: Plan Approved

ci:
  autofix: false

knowledgebase:
  enabled: false
